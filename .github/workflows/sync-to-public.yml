name: Sync main to public repo

# Syncs source (this private repo) to -> public casualties-together.
# Runs/push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repo (full history)
        uses: actions/checkout@v4
        with:
          repository: creaturefeaturelarry/casualties-together
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Apply source tree and push
        env:
          SRC_REPO: creaturefeaturelarry/casualties-together-source
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Read this private source repo using the workflow's own token.
          git remote add src "https://x-access-token:${GH_TOKEN}@github.com/${SRC_REPO}.git"
          git fetch --no-tags --depth=1 src main
          SRC_SHA="$(git rev-parse --short FETCH_HEAD)"

          git read-tree --reset -u FETCH_HEAD

          # Not published to the public repo
          EXCLUDES=(
            .github/workflows
            Executable
            LiteEntitySystem
            ScavPrototypeMP/Optimizinator/Evidence/archived
            libs/BepInEx_win_x64_5.4.23.5.zip
          )
          git rm -r --cached --quiet --ignore-unmatch "${EXCLUDES[@]}"
          rm -rf "${EXCLUDES[@]}"

          if git diff --cached --quiet HEAD; then
            echo "Nothing to sync!"
            exit 0
          fi

          echo "Syncing public repo to source ${SRC_SHA}:"
          git diff --cached --stat HEAD | tail -n 1

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from source @ ${SRC_SHA}"

          git push origin HEAD:main
